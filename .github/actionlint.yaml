config-variables:
  - BREW_COMMIT_CLIENT_ID
  - GH_AW_DEFAULT_DETECTION_MAX_AI_CREDITS
  - GH_AW_DEFAULT_MAX_AI_CREDITS
  - GH_AW_DEFAULT_MAX_DAILY_AI_CREDITS
  - GH_AW_DEFAULT_MAX_TURNS
  - GH_AW_DEFAULT_MODEL_COPILOT
  - GH_AW_DEFAULT_OTLP_ENDPOINT
  - GH_AW_MODEL_AGENT_COPILOT
  - GH_AW_POLICY_ALLOW_CREATE_PULL_REQUEST
  - GH_AW_RUNTIME_FEATURES

paths:
  "**/.github/workflows/update-omlx.lock.yml":
    ignore:
      # The gh-aw compiler validates this generated workflow against its
      # extended schema, which includes fields unknown to stock actionlint.
      - ".*"
