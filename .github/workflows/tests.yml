name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  agentic-workflow-lock:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check agentic workflow locks
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/github/gh-aw/releases/download/v0.87.10/linux-amd64 \
            --output "$RUNNER_TEMP/gh-aw"
          echo "1624fb3a6e93b48046377c7b26c9b326e2b25056b3f36cc3fd3bf0ebee7d59fd  $RUNNER_TEMP/gh-aw" | sha256sum --check
          chmod +x "$RUNNER_TEMP/gh-aw"
          for workflow in .github/workflows/*.md; do
            "$RUNNER_TEMP/gh-aw" compile "$workflow" --no-check-update
          done
          git diff --exit-code -- .github/workflows/ .github/aw/actions-lock.json
          untracked_locks="$(git ls-files --others --exclude-standard -- '.github/workflows/*.lock.yml')"
          if [ -n "$untracked_locks" ]; then
            echo "Commit the generated workflow locks:"
            echo "$untracked_locks"
            exit 1
          fi

  test-bot:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Run formula tests
        run: |
          changed_formulae="$(git diff --name-only origin/main...HEAD -- 'Formula/*.rb')"
          if [[ "${changed_formulae}" == "Formula/omlx.rb" ]]; then
            if [[ "${RUNNER_OS}" == "macOS" ]]; then
              brew install --HEAD --build-from-source scaryrawr/formulae/omlx
              brew test omlx
            else
              echo "Skipping head-only macOS formula omlx on ${RUNNER_OS}"
            fi
          else
            brew test-bot --only-formulae
          fi
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
